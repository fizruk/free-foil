name: free-foil
version: 0.3.3
github: "fizruk/free-foil"
license: BSD3
author: "Nikolai Kudasov"
maintainer: "nickolay.kudasov@gmail.com"
copyright: "2023–2024 Nikolai Kudasov, Renata Shakirova, Egor Shalagin, Karina Tyulebaeva"

extra-source-files:
  - README.md
  - ChangeLog.md
  - LICENSE

synopsis: Efficient Type-Safe Capture-Avoiding Substitution for Free (Scoped Monads)
category: Parsing # same as BNFC

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/fizruk/free-foil#readme>

dependencies:
  array: ">= 0.5.3.0 && < 0.6"
  base: ">= 4.19 && < 5"
  text: ">= 1.2.3.1 && < 2.2"
  containers: ">= 0.6.8 && < 0.9"  # >= 0.6.8 for Data.IntSet.fromRange
  binary: ">= 0.8"  # a GHC boot library; used only by Control.Monad.Free.Foil.Binary
  bifunctors: ">= 5.5 && < 5.7"
  template-haskell: ">= 2.21.0.0 && < 2.24"
  deepseq: ">= 1.4 && < 1.6"
  kind-generics: ">= 0.5.0 && < 0.6"

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  # - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -optP-Wno-nonportable-include-path

library:
  source-dirs: src

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - free-foil
      - hspec
      - hspec-discover
      - kind-generics-th
      - QuickCheck
      - containers

  doctests:
    source-dirs:
      - src/
      - test/doctests
    main: Main.hs
    other-modules: []
    dependencies:
      - free-foil
      - doctest-parallel

benchmarks:
  zipmatchk:
    main: Main.hs
    source-dirs: bench/zipmatchk
    ghc-options:
      - -O2
      - -rtsopts
    dependencies:
      - free-foil
      - kind-generics-th
      - tasty-bench

  normalize:
    main: Main.hs
    source-dirs: bench/normalize
    ghc-options:
      - -O2
      - -rtsopts
    dependencies:
      - free-foil
      - tasty-bench
